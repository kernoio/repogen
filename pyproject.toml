[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "repogen"
version = "0.1.0"
description = "Generate synthetic benchmark repositories from a spec and language list"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "anthropic>=0.25",
    "tabulate>=0.9",
]

[project.scripts]
repogen = "repogen:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["repogen*"]

[tool.ruff]
line-length = 100
target-version = "py310"
